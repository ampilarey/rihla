<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Rihla Travels">
  <title>Rihla Travels</title>
  <!-- The app and browser icon: the two brand colours as field and figure.
       A chiffon disc on a violet ground, carrying the violet ship.
       Lemon chiffon #FEF9CD and ultra violet #5F498A are 7.00:1 apart, so
       every edge here clears AAA on every browser chrome, light or dark.
       Painting them as two shapes on one shared ground cannot work — that
       needs about 9:1 — which is why the inline mark in rihla-mark.svg uses
       a different pair and this one does not.
       The disc radius is 38 of 100 deliberately: Android crops a maskable
       icon to the middle 80%, so the artwork has to stay inside r=40. -->
  <rect width="100" height="100" fill="#5F498A"/>
  <circle cx="50" cy="50" r="38.0" fill="#FEF9CD"/>
  <g transform="translate(30.63 29.95) scale(0.62)">
    <path fill="#5F498A" d="M 0.00 47.04 C 13.23 60.27 47.04 60.27 62.47 41.16 C 60.27 55.86 44.10 64.68 30.87 64.68 C 18.38 64.68 6.61 57.33 0.00 47.04 Z"/>
    <path fill="#5F498A" d="M 28.66 11.76 C 23.52 24.99 18.38 35.28 17.64 45.57 L 28.66 45.57 L 28.66 11.76 Z"/>
    <path fill="#5F498A" d="M 34.54 0.00 C 44.10 14.70 52.92 29.40 52.18 45.57 L 34.54 45.57 L 34.54 0.00 Z"/>
  </g>
</svg>
