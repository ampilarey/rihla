name: CI

# Nothing verified this repository before now, while `main` auto-deploys to
# test.rihla.mv. Make this a required check before merge.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job carries `timeout-minutes: 15`. GitHub's default is six hours, and
# the whole run normally finishes in about two minutes, so nothing legitimate
# comes near fifteen.
#
# Added after a job was misread as hanging when it had in fact already failed
# — the check-runs API went on reporting it in_progress for a quarter of an
# hour afterwards. A real hang is possible here (the booking tests take row
# locks, and MySQL's `lock_wait_timeout` defaults to a year) and would be
# indistinguishable from a slow job for six hours. This makes either case
# end quickly and say so.

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the composer floor; the cPanel deploy scripts put ea-php84 on
        # PATH, so production is verified too.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, tokenizer, pdo, pdo_sqlite, gd
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Blade layouts use @vite, so views cannot render without a build.
      - run: npm ci
      - run: npm run build

      - run: php artisan test

  mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The booking engine's capacity guarantee rests on SELECT ... FOR UPDATE
    # row locking, which SQLite cannot exercise. A concurrency test that only
    # ever runs on SQLite reports green while proving nothing, so the suite
    # also runs against the engine production uses.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rihla_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, tokenizer, pdo, pdo_mysql, gd
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # A deadlocked booking test otherwise waits essentially forever: MySQL's
      # `innodb_lock_wait_timeout` defaults to 50s per statement and
      # `lock_wait_timeout` — the metadata lock a migration takes — to a year.
      # The job timeout above stops that at fifteen minutes, but it stops it
      # by killing the runner, so the log ends mid-suite and names no test.
      # Bounded here instead, a lock that will not come fails in half a minute
      # with the test that was waiting for it printed beside it.
      #
      # 30s is far longer than anything legitimate: the whole suite against a
      # real MySQL takes about three and a half minutes and no single lock in
      # it is held for more than milliseconds.
      - name: Bound the lock waits so a deadlock fails fast and says which test
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            SET GLOBAL innodb_lock_wait_timeout = 30;
            SET GLOBAL lock_wait_timeout = 60;
          "

      - name: Run tests against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: rihla_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Pint runs on changed files only. The existing codebase carries many
      # pre-existing style violations, and reformatting it wholesale would
      # bury real changes in noise. This ratchets: new and edited files must
      # be clean. Widen to the whole tree once the backlog is cleared.
      - name: Pint (changed files)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit; checking files changed in HEAD."
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- '*.php' | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No PHP files changed."
            exit 0
          fi
          echo "Checking: $FILES"
          vendor/bin/pint --test $FILES

      # If this is red on its first run, generate a baseline rather than
      # weakening the level:
      #   vendor/bin/phpstan analyse --generate-baseline
      - name: Larastan
        run: composer analyse

  assets:
    name: Committed build is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # public/build is committed because the cPanel host has no Node, and the
    # deploy script serves exactly what is in git. A stale build therefore
    # ships silently: edit a stylesheet, forget to rebuild, and production
    # keeps serving the old CSS.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail if the committed assets differ from a fresh build
        run: |
          if ! git diff --quiet -- public/build; then
            echo "::error::public/build is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- public/build
            exit 1
          fi
          echo "Committed build matches a fresh build."

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `npm run lighthouse` existed in package.json and CI never ran it, so
    # nothing stopped an accessibility or SEO regression reaching the site.
    # The first run of this found two: a "Learn More" link that tells a
    # screen-reader user nothing, and a footer heading that skipped a level
    # on any page with no h2 of its own.
    #
    # The thresholds live in lighthouse-budget.json and every one of them was
    # measured against the real pages before it was written down. Only the
    # deterministic categories gate a merge; performance is reported and does
    # not fail, because it is timing on a shared runner and a gate that flakes
    # is one people learn to re-run until it passes.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, tokenizer, pdo, pdo_sqlite, gd
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # The homepage queries the trips table and the guide needs its steps,
      # so an unseeded database audits an empty page and proves nothing.
      - name: Migrate and seed
        run: |
          touch database/database.sqlite
          php artisan migrate --force --seed

      # Served and audited in one step. A server backgrounded in one step
      # and used in the next depends on the runner not reaping the step
      # shell's children, which is a thing that happens to be true rather
      # than a thing that is promised.
      - name: Serve and audit
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT

          up=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/en; then
              up=1
              break
            fi
            sleep 1
          done

          if [ "$up" -ne 1 ]; then
            echo "::error::The site never came up, so nothing was audited."
            exit 1
          fi

          node scripts/lighthouse-check.mjs http://127.0.0.1:8000

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
